[package]
name = "saient-quartz"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local LLM, image and video inference in pure Rust — GGUF quantised models on CPU, CUDA or hand-written Vulkan compute shaders, including a from-scratch Wan2.1 text-to-video pipeline."
repository = "https://github.com/SaientAI/saient-quartz"
readme = "README.md"
keywords = ["llm", "inference", "gguf", "vulkan", "quantization"]
categories = ["science", "command-line-utilities"]
# Fixtures for #[ignore]d parity tests that also need multi-gigabyte model
# weights which are not distributed here; regenerate them with the capture
# command in reference/README.md. reference/dit is kept because the routine
# suite's RoPE parity test reads it.
exclude = ["reference/vae/*", "reference/t5/*", "reference-dump.patch"]

# The package is `saient-quartz` because `quartz` was already taken on
# crates.io, but the installed command stays `quartz`.
[[bin]]
name = "quartz"
path = "src/main.rs"

[features]
cuda = []
vulkan = ["dep:ash"]

[dependencies]
memmap2 = "0.9"
anyhow = "1"
rayon = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-stream = "0.1"
futures-util = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
minijinja = { version = "2", features = ["loop_controls"] }
ash = { version = "0.37", optional = true, default-features = false, features = ["loaded"] }

[profile.release]
opt-level = 3
